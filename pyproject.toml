[project]
name = "redash-mcp"
version = "0.1.0"
description = "MCP server for the Redash API"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26.0,<2",  # mcp 2.x renombra FastMCP (rompe imports); sin lockfile un rebuild lo trae
    "httpx>=0.27.0",
    "certifi>=2026.10.19",  # emSign 20-oct-2026: sin la raíz emSign ECC G3
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redash_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
relative_files = true
source = ["src/redash_mcp"]

[tool.coverage.xml]
output = "coverage/coverage.xml"
